<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>权重图画笔</title>
<!-- 人物摆动的权重图（rig_paint/<部位>.png，灰度：白 = 动满，黑 = 不动）直接在人物上刷。
     打开 PNG：ref_char.png（垫底的人物）和要改的灰度图，拖进来或点按钮；scripts/rig_painter_embed.py 能把图嵌进网页，双击就能用。
     保存：Chrome / Edge 第一次选位置，之后 Ctrl+S 直接覆盖；别的浏览器下载到下载目录。 -->
<style>
:root { --bg: #17171b; --panel: #222228; --line: #34343c; --text: #e6e6ea; --dim: #9a9aa6; --acc: #6aa8ff; --warn: #ffb454; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Microsoft YaHei", sans-serif; }
body { display: grid; grid-template-columns: 270px 1fr; grid-template-rows: 1fr 26px; height: 100vh; overflow: hidden; }
#side { grid-row: 1 / 3; background: var(--panel); border-right: 1px solid var(--line); padding: 12px; overflow-y: auto; }
#view { position: relative; overflow: hidden; background: #0e0e11; cursor: none; }
#status { background: var(--panel); border-top: 1px solid var(--line); padding: 4px 10px; color: var(--dim); white-space: nowrap; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: pixelated; }
#ring { position: absolute; pointer-events: none; border: 1px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px #000; display: none; }
#ring::after { content: ""; position: absolute; inset: var(--hard); border: 1px dashed rgba(255,255,255,.55); border-radius: 50%; }
h2 { font-size: 12px; color: var(--dim); font-weight: 600; margin: 14px 0 6px; letter-spacing: .04em; }
h2:first-child { margin-top: 0; }
.row { display: flex; gap: 6px; align-items: center; margin: 5px 0; }
.row label { flex: 0 0 58px; color: var(--dim); }
.row input[type=range] { flex: 1; min-width: 0; }
.row output { flex: 0 0 38px; text-align: right; font-variant-numeric: tabular-nums; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; border: 0; border-right: 1px solid var(--line); border-radius: 0; }
.seg button:last-child { border-right: 0; }
button { background: #2c2c34; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; cursor: pointer; font: inherit; }
button:hover { background: #35353f; }
button.on { background: var(--acc); color: #0b1220; font-weight: 600; }
button.wide { width: 100%; margin: 3px 0; }
.dirty { color: var(--warn); }
.hint { color: var(--dim); font-size: 12px; line-height: 1.6; }
.hint b { color: var(--text); font-weight: 600; }
#swatch { width: 26px; height: 26px; border-radius: 5px; border: 1px solid var(--line); flex: 0 0 26px; }
#drop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 18px; background: rgba(20,40,80,.6); pointer-events: none; }
#empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); text-align: center; line-height: 1.8; }
input[type=file] { display: none; }
</style>
</head>
<body>
<div id="side">
  <h2>正在改</h2>
  <div class="seg" id="mapSeg"></div>
  <div class="row" style="margin-top:8px"><span id="mapState" class="hint"></span></div>

  <h2>工具</h2>
  <div class="seg" id="toolSeg">
    <button data-tool="set" title="把权重刷向目标值（1）">刷值</button>
    <button data-tool="add" title="加亮（2）">加</button>
    <button data-tool="sub" title="压暗（3）">减</button>
    <button data-tool="smooth" title="抹平、柔化边缘（4）">柔化</button>
  </div>
  <div class="row"><label>目标值</label><input id="value" type="range" min="0" max="1" step="0.01" value="1"><output id="valueOut"></output><div id="swatch"></div></div>
  <div class="row"><label>笔刷大小</label><input id="size" type="range" min="2" max="300" step="1" value="40"><output id="sizeOut"></output></div>
  <div class="row"><label>硬度</label><input id="hard" type="range" min="0" max="0.95" step="0.05" value="0.3"><output id="hardOut"></output></div>
  <div class="row"><label>流量</label><input id="flow" type="range" min="0.02" max="1" step="0.02" value="0.3"><output id="flowOut"></output></div>

  <h2>显示</h2>
  <div class="seg" id="modeSeg">
    <button data-mode="heat" title="人物上盖热力图（V 切换）">热力图</button>
    <button data-mode="gray" title="只看灰度图">灰度</button>
    <button data-mode="ref" title="只看人物">人物</button>
  </div>
  <div class="row"><label>叠加</label><input id="opac" type="range" min="0" max="1" step="0.05" value="1"><output id="opacOut"></output></div>
  <div class="row"><label><input id="other" type="checkbox" checked> 轮廓</label><span class="hint">另一张图的范围（青线）</span></div>

  <h2>文件</h2>
  <button class="wide" id="save">保存这张（Ctrl+S）</button>
  <button class="wide" id="openMap">打开灰度图…</button>
  <button class="wide" id="openRef">打开人物 ref_char.png…</button>
  <button class="wide" id="revert">撤回到打开时的样子</button>
  <input type="file" id="fileMap" accept="image/png">
  <input type="file" id="fileRef" accept="image/png">

  <h2>操作</h2>
  <div class="hint">
    <b>左键</b> 刷 · <b>Alt+左键</b> 吸取权重值<br>
    <b>滚轮</b> 缩放 · <b>空格/右键/中键拖</b> 平移 · <b>F</b> 适合窗口<br>
    <b>[ ]</b> 笔刷大小 · <b>Shift+[ ]</b> 硬度<br>
    <b>1–4</b> 工具 · <b>X</b> 目标值 0 ↔ 1 · <b>V</b> 切换显示<br>
    <b>Ctrl+Z / Ctrl+Y</b> 撤销 / 重做<br><br>
    灰度：白 = 动满，黑 = 不动。尾巴图是转动量（根 0、尖 1）。边缘用软笔刷，硬边在交界处会扯出折痕。
  </div>
</div>
<div id="view">
  <canvas id="stage"></canvas>
  <div id="ring"></div>
  <div id="empty">把 ref_char.png 和要改的灰度图（hair.png、tail.png …）拖进来<br>或用左边的按钮打开</div>
  <div id="drop">放开以打开</div>
</div>
<div id="status"></div>

<script>
"use strict";
// ---- 状态
const W0 = 1920, H0 = 1080;
let W = W0, H = H0;
const maps = {};          // 名字 -> {data: Float32Array, orig, undo: [], redo: [], dirty, handle}
let cur = null;           // 正在改的图的名字
let ref = null;           // 人物：Uint8ClampedArray RGBA
let tool = "set", mode = "heat";
const P = { value: 1, size: 40, hard: 0.3, flow: 0.3, opac: 1, other: true };
let zoom = 1, panX = 0, panY = 0;

const view = document.getElementById("view"), cv = document.getElementById("stage"), ctx = cv.getContext("2d");
const ring = document.getElementById("ring"), statusEl = document.getElementById("status");
let disp = null;          // 显示用的 ImageData
let otherEdge = null;     // 另一张图的轮廓（Uint8Array）

// ---- turbo 色标
const TURBO = new Uint8ClampedArray(256 * 3);
for (let i = 0; i < 256; i++) {
  const x = i / 255;
  const r = 0.13572138 + x * (4.61539260 + x * (-42.66032258 + x * (132.13108234 + x * (-152.94239396 + x * 59.28637943))));
  const g = 0.09140261 + x * (2.19418839 + x * (4.84296658 + x * (-14.18503333 + x * (4.27729857 + x * 2.82956604))));
  const b = 0.10667330 + x * (12.64194608 + x * (-60.58204836 + x * (110.36276771 + x * (-89.90310912 + x * 27.34824973))));
  TURBO[i * 3] = r * 255; TURBO[i * 3 + 1] = g * 255; TURBO[i * 3 + 2] = b * 255;
}

// ---- 读图
function loadImage(src) {
  return new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = src; });
}
function pixels(im) {
  const c = document.createElement("canvas"); c.width = im.width; c.height = im.height;
  const g = c.getContext("2d"); g.drawImage(im, 0, 0);
  return g.getImageData(0, 0, im.width, im.height).data;
}
function setSize(w, h) {
  if (w === W && h === H && disp) return;
  W = w; H = h; cv.width = W; cv.height = H; disp = ctx.createImageData(W, H);
}
async function addRef(src) {
  const im = await loadImage(src);
  setSize(im.width, im.height);
  ref = pixels(im);
  afterLoad();
}
async function addMap(name, src) {
  const im = await loadImage(src);
  if (!disp) setSize(im.width, im.height);
  if (im.width !== W || im.height !== H) { alert(`${name}.png 是 ${im.width}×${im.height}，人物是 ${W}×${H}，尺寸要一样`); return; }
  const px = pixels(im), d = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) d[i] = px[i * 4] / 255;
  maps[name] = { data: d, orig: d.slice(), undo: [], redo: [], dirty: false, handle: null };
  cur = name;
  afterLoad();
}
function afterLoad() {
  document.getElementById("empty").style.display = (ref || cur) ? "none" : "flex";
  buildMapSeg(); computeOther(); fit(); renderAll(); ui();
}

// ---- 显示
function renderRect(x0, y0, x1, y1) {
  if (!disp) return;
  x0 = Math.max(0, x0 | 0); y0 = Math.max(0, y0 | 0); x1 = Math.min(W, Math.ceil(x1)); y1 = Math.min(H, Math.ceil(y1));
  if (x1 <= x0 || y1 <= y0) return;
  const D = disp.data, m = cur ? maps[cur].data : null, op = P.opac;
  for (let y = y0; y < y1; y++) {
    for (let x = x0; x < x1; x++) {
      const i = y * W + x, o = i * 4;
      let br = 34, bg = 34, bb = 40;
      if (ref) { const a = ref[o + 3] / 255; br = ref[o] * a + 34 * (1 - a); bg = ref[o + 1] * a + 34 * (1 - a); bb = ref[o + 2] * a + 40 * (1 - a); }
      let r, g, b;
      if (mode === "ref" || !m) { r = br; g = bg; b = bb; }
      else if (mode === "gray") { const v = m[i] * 255; r = v * op + br * (1 - op); g = v * op + bg * (1 - op); b = v * op + bb * (1 - op); }
      else {
        const v = m[i], q = Math.round(v * 255) * 3, k = Math.min(v * 4, 0.85) * op, dm = 0.55;
        r = br * dm * (1 - k) + TURBO[q] * k; g = bg * dm * (1 - k) + TURBO[q + 1] * k; b = bb * dm * (1 - k) + TURBO[q + 2] * k;
      }
      if (P.other && otherEdge && otherEdge[i] && mode !== "ref") { r = 0; g = 255; b = 255; }
      D[o] = r; D[o + 1] = g; D[o + 2] = b; D[o + 3] = 255;
    }
  }
  ctx.putImageData(disp, 0, 0, x0, y0, x1 - x0, y1 - y0);
}
function renderAll() { renderRect(0, 0, W, H); }
function computeOther() {
  otherEdge = null;
  const names = Object.keys(maps).filter(n => n !== cur);
  if (!names.length) return;
  otherEdge = new Uint8Array(W * H);
  for (const n of names) {
    const d = maps[n].data;
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x, a = d[i] > 0.05;
      if (a && !(d[i - 1] > 0.05 && d[i + 1] > 0.05 && d[i - W] > 0.05 && d[i + W] > 0.05)) otherEdge[i] = 1;
    }
  }
}

// ---- 视图：缩放、平移
function applyView() { cv.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`; cv.style.imageRendering = zoom >= 2 ? "pixelated" : "auto"; }
function fit() {
  const r = view.getBoundingClientRect();
  zoom = Math.min(r.width / W, r.height / H); panX = (r.width - W * zoom) / 2; panY = (r.height - H * zoom) / 2; applyView();
}
function toImg(e) { const r = view.getBoundingClientRect(); return [(e.clientX - r.left - panX) / zoom, (e.clientY - r.top - panY) / zoom]; }
view.addEventListener("wheel", e => {
  e.preventDefault();
  const r = view.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const z = Math.min(32, Math.max(0.1, zoom * Math.pow(1.0015, -e.deltaY)));
  panX = mx - (mx - panX) * z / zoom; panY = my - (my - panY) * z / zoom; zoom = z; applyView(); moveRing(e);
}, { passive: false });

// ---- 笔刷
let painting = false, panning = false, spaceDown = false, last = null, before = null, box = null;
function dab(cx, cy) {
  const m = maps[cur].data, R = P.size / 2, hard = P.hard, fl = P.flow, tgt = P.value;
  const x0 = Math.max(0, Math.floor(cx - R)), x1 = Math.min(W - 1, Math.ceil(cx + R));
  const y0 = Math.max(0, Math.floor(cy - R)), y1 = Math.min(H - 1, Math.ceil(cy + R));
  if (x1 < x0 || y1 < y0) return;
  let src = null, sr = 0;
  if (tool === "smooth") {           // 抹平：和周围 r 范围的平均值靠拢（先拷一份，免得边算边改）
    sr = Math.max(1, Math.round(R / 4));
    const bx0 = Math.max(0, x0 - sr), bx1 = Math.min(W - 1, x1 + sr), by0 = Math.max(0, y0 - sr), by1 = Math.min(H - 1, y1 + sr);
    const bw = bx1 - bx0 + 1, bh = by1 - by0 + 1, S = new Float64Array((bw + 1) * (bh + 1));
    for (let y = 0; y < bh; y++) { let row = 0; for (let x = 0; x < bw; x++) { row += m[(by0 + y) * W + bx0 + x]; S[(y + 1) * (bw + 1) + x + 1] = S[y * (bw + 1) + x + 1] + row; } }
    src = { S, bx0, by0, bw, bh };
  }
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy) / R;
    if (d >= 1) continue;
    let f = d <= hard ? 1 : 1 - (d - hard) / (1 - hard); f = f * f * (3 - 2 * f); f *= fl;
    const i = y * W + x;
    if (tool === "set") m[i] += (tgt - m[i]) * f;
    else if (tool === "add") m[i] = Math.min(1, m[i] + f * 0.25);
    else if (tool === "sub") m[i] = Math.max(0, m[i] - f * 0.25);
    else {
      const { S, bx0, by0, bw, bh } = src;
      const ax = Math.max(0, x - sr - bx0), bxx = Math.min(bw - 1, x + sr - bx0), ay = Math.max(0, y - sr - by0), byy = Math.min(bh - 1, y + sr - by0);
      const n = (bxx - ax + 1) * (byy - ay + 1), s = S[(byy + 1) * (bw + 1) + bxx + 1] - S[ay * (bw + 1) + bxx + 1] - S[(byy + 1) * (bw + 1) + ax] + S[ay * (bw + 1) + ax];
      m[i] += (s / n - m[i]) * f;
    }
  }
  box = box ? [Math.min(box[0], x0), Math.min(box[1], y0), Math.max(box[2], x1 + 1), Math.max(box[3], y1 + 1)] : [x0, y0, x1 + 1, y1 + 1];
  renderRect(x0, y0, x1 + 1, y1 + 1);
}
function strokeTo(p) {
  const step = Math.max(1, P.size / 8);
  const dx = p[0] - last[0], dy = p[1] - last[1], n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / step));
  for (let k = 1; k <= n; k++) dab(last[0] + dx * k / n, last[1] + dy * k / n);
  last = p;
}
function endStroke() {
  if (!painting) return;
  painting = false;
  if (box) {
    const M = maps[cur], [x0, y0, x1, y1] = box, w = x1 - x0, h = y1 - y0, old = new Float32Array(w * h);
    for (let y = 0; y < h; y++) old.set(before.subarray((y0 + y) * W + x0, (y0 + y) * W + x0 + w), y * w);
    M.undo.push({ x0, y0, w, h, data: old }); if (M.undo.length > 200) M.undo.shift();
    M.redo = []; M.dirty = true; ui();
  }
  before = null; box = null;
}
function swapRect(M, from, to) {
  const e = from.pop(); if (!e) return;
  const { x0, y0, w, h } = e, now = new Float32Array(w * h);
  for (let y = 0; y < h; y++) { const o = (y0 + y) * W + x0; now.set(M.data.subarray(o, o + w), y * w); M.data.set(e.data.subarray(y * w, y * w + w), o); }
  to.push({ x0, y0, w, h, data: now }); M.dirty = true; renderRect(x0, y0, x0 + w, y0 + h); ui();
}
function pick(p) {
  if (!cur) return;
  const x = Math.floor(p[0]), y = Math.floor(p[1]); if (x < 0 || y < 0 || x >= W || y >= H) return;
  P.value = Math.round(maps[cur].data[y * W + x] * 100) / 100; tool = "set"; ui();
}

view.addEventListener("contextmenu", e => e.preventDefault());
view.addEventListener("pointerdown", e => {
  view.setPointerCapture(e.pointerId);
  if (e.button === 1 || e.button === 2 || spaceDown) { panning = [e.clientX, e.clientY, panX, panY]; return; }
  if (e.button !== 0 || !cur) return;
  const p = toImg(e);
  if (e.altKey) { pick(p); return; }
  painting = true; before = maps[cur].data.slice(); box = null; last = p; dab(p[0], p[1]);
});
view.addEventListener("pointermove", e => {
  moveRing(e);
  if (panning) { panX = panning[2] + e.clientX - panning[0]; panY = panning[3] + e.clientY - panning[1]; applyView(); return; }
  if (painting) { for (const ev of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])) strokeTo(toImg(ev)); }
});
view.addEventListener("pointerup", () => { panning = false; endStroke(); });
view.addEventListener("pointercancel", () => { panning = false; endStroke(); });
view.addEventListener("pointerleave", () => { ring.style.display = "none"; });
function moveRing(e) {
  const r = view.getBoundingClientRect(), d = P.size * zoom;
  ring.style.display = "block"; ring.style.width = ring.style.height = d + "px";
  ring.style.left = (e.clientX - r.left - d / 2) + "px"; ring.style.top = (e.clientY - r.top - d / 2) + "px";
  ring.style.setProperty("--hard", `${(1 - P.hard) * d / 2}px`);
  const [x, y] = toImg(e), xi = Math.floor(x), yi = Math.floor(y);
  let s = `x ${xi}  y ${yi}  ·  u ${(x / W).toFixed(3)}  v ${(y / H).toFixed(3)}`;
  if (xi >= 0 && yi >= 0 && xi < W && yi < H) for (const n of Object.keys(maps)) s += `  ·  ${n} ${maps[n].data[yi * W + xi].toFixed(2)}`;
  statusEl.textContent = s + `  ·  缩放 ${(zoom * 100).toFixed(0)}%`;
}

// ---- 保存
async function save() {
  if (!cur) return;
  const M = maps[cur], c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"), im = g.createImageData(W, H);
  for (let i = 0; i < W * H; i++) { const v = Math.round(Math.min(1, Math.max(0, M.data[i])) * 255); im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0);
  const blob = await new Promise(ok => c.toBlob(ok, "image/png"));
  const download = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = cur + ".png"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); };
  try {
    if (window.showSaveFilePicker) {
      if (!M.handle) M.handle = await showSaveFilePicker({ suggestedName: cur + ".png", types: [{ description: "PNG", accept: { "image/png": [".png"] } }] });
      const w = await M.handle.createWritable(); await w.write(blob); await w.close();
    } else download();
    M.dirty = false; ui(); flash(`已保存 ${M.handle ? M.handle.name : cur + ".png（在下载目录）"}`);
  } catch (err) {
    if (err.name === "AbortError") return;
    M.handle = null; download(); M.dirty = false; ui(); flash(`不能直接写文件（${err.name}），已下载 ${cur}.png 到下载目录`);
  }
}
let flashT = 0;
function flash(t) { statusEl.textContent = t; statusEl.style.color = "var(--acc)"; clearTimeout(flashT); flashT = setTimeout(() => statusEl.style.color = "", 1500); }

// ---- 打开文件
function nameOf(f) { return f.name.replace(/\.png$/i, "").replace(/_heat$/, ""); }
function readFile(f) { return URL.createObjectURL(f); }
async function openFiles(files) {
  for (const f of files) {
    if (!/\.png$/i.test(f.name)) continue;
    if (/ref_char/i.test(f.name)) await addRef(readFile(f));
    else if (/_heat\.png$/i.test(f.name)) alert(`${f.name} 是热力图，只用来看；要改的是灰度图 ${nameOf(f)}.png`);
    else await addMap(nameOf(f), readFile(f));
  }
}
document.getElementById("openMap").onclick = () => document.getElementById("fileMap").click();
document.getElementById("openRef").onclick = () => document.getElementById("fileRef").click();
document.getElementById("fileMap").onchange = e => openFiles(e.target.files);
document.getElementById("fileRef").onchange = e => { if (e.target.files[0]) addRef(readFile(e.target.files[0])); };
const dropEl = document.getElementById("drop");
window.addEventListener("dragover", e => { e.preventDefault(); dropEl.style.display = "flex"; });
window.addEventListener("dragleave", e => { if (!e.relatedTarget) dropEl.style.display = "none"; });
window.addEventListener("drop", e => { e.preventDefault(); dropEl.style.display = "none"; openFiles(e.dataTransfer.files); });
document.getElementById("save").onclick = save;
document.getElementById("revert").onclick = () => {
  if (!cur || !confirm(`把 ${cur} 撤回到打开时的样子？（可以 Ctrl+Z 回来）`)) return;
  const M = maps[cur]; M.undo.push({ x0: 0, y0: 0, w: W, h: H, data: M.data.slice() }); M.redo = [];
  M.data.set(M.orig); M.dirty = true; renderAll(); ui();
};
window.addEventListener("beforeunload", e => { if (Object.values(maps).some(M => M.dirty)) { e.preventDefault(); e.returnValue = ""; } });

// ---- 面板
function buildMapSeg() {
  const seg = document.getElementById("mapSeg"); seg.innerHTML = "";
  for (const n of Object.keys(maps)) {
    const b = document.createElement("button"); b.textContent = n; b.onclick = () => { cur = n; computeOther(); renderAll(); ui(); }; b.dataset.map = n; seg.appendChild(b);
  }
}
const sliders = { value: v => v.toFixed(2), size: v => v + "px", hard: v => v.toFixed(2), flow: v => v.toFixed(2), opac: v => v.toFixed(2) };
for (const k of Object.keys(sliders)) {
  const el = document.getElementById(k);
  el.oninput = () => { P[k] = +el.value; if (k === "opac") renderAll(); ui(); };
}
document.getElementById("other").onchange = e => { P.other = e.target.checked; renderAll(); };
document.querySelectorAll("#toolSeg button").forEach(b => b.onclick = () => { tool = b.dataset.tool; ui(); });
document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => { mode = b.dataset.mode; renderAll(); ui(); });
function ui() {
  for (const k of Object.keys(sliders)) { const el = document.getElementById(k); el.value = P[k]; document.getElementById(k + "Out").textContent = sliders[k](P[k]); }
  const g = Math.round(P.value * 255); document.getElementById("swatch").style.background = `rgb(${g},${g},${g})`;
  document.querySelectorAll("#toolSeg button").forEach(b => b.classList.toggle("on", b.dataset.tool === tool));
  document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  document.querySelectorAll("#mapSeg button").forEach(b => { b.classList.toggle("on", b.dataset.map === cur); b.textContent = b.dataset.map + (maps[b.dataset.map].dirty ? " *" : ""); });
  const st = document.getElementById("mapState");
  if (cur) { const M = maps[cur]; st.innerHTML = M.dirty ? `<span class="dirty">${cur} 有没保存的改动</span>` : `${cur}：已保存 / 未改`; } else st.textContent = "还没打开灰度图";
}

// ---- 键盘
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range" && e.target.type !== "checkbox") return;
  const M = cur && maps[cur];
  if (e.ctrlKey || e.metaKey) {
    const k = e.key.toLowerCase();
    if (k === "s") { e.preventDefault(); save(); }
    else if (k === "z" && M) { e.preventDefault(); e.shiftKey ? swapRect(M, M.redo, M.undo) : swapRect(M, M.undo, M.redo); }
    else if (k === "y" && M) { e.preventDefault(); swapRect(M, M.redo, M.undo); }
    return;
  }
  if (e.key === " ") { spaceDown = true; view.style.cursor = "grab"; e.preventDefault(); return; }
  if (e.key === "[" || e.key === "]") {
    const up = e.key === "]";
    if (e.shiftKey) P.hard = Math.min(0.95, Math.max(0, +(P.hard + (up ? 0.05 : -0.05)).toFixed(2)));
    else P.size = Math.min(300, Math.max(2, Math.round(P.size * (up ? 1.15 : 1 / 1.15))));
    ui(); return;
  }
  const tools = { "1": "set", "2": "add", "3": "sub", "4": "smooth" };
  if (tools[e.key]) { tool = tools[e.key]; ui(); }
  else if (e.key === "x" || e.key === "X") { P.value = P.value < 0.5 ? 1 : 0; tool = "set"; ui(); }
  else if (e.key === "v" || e.key === "V") { mode = { heat: "gray", gray: "ref", ref: "heat" }[mode]; renderAll(); ui(); }
  else if (e.key === "f" || e.key === "F") fit();
});
window.addEventListener("keyup", e => { if (e.key === " ") { spaceDown = false; view.style.cursor = ""; } });
window.addEventListener("resize", fit);

// ---- 嵌进来的图（rig_painter_embed.py 生成的那份才有）
(async () => {
  ui();
  const E = window.EMBED;
  if (!E) return;
  if (E.ref) await addRef(E.ref);
  for (const [n, src] of Object.entries(E.maps || {})) await addMap(n, src);
  if (E.first && maps[E.first]) { cur = E.first; computeOther(); renderAll(); ui(); }
})();
</script>
</body>
</html>
